name: Playwright Tests
run-name: PetStore API Playwright Tests

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  Run-Tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Tests
        run: |
             npm ci
             PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml npx playwright test --reporter=list,junit

      - name: Create Test Summary
        uses: test-summary/action@dist
        if: success() || failure()
        with:
          paths: results.xml

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6     # checkout the repo
      - run: npm ci                   # install packages
      - run: PLAYWRIGHT_JUNIT_OUTPUT_NAME=results.xml npx playwright test --reporter=list,junit,html # run tests with junit reporter

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ success() || failure() }}       # run this step even if previous step failed
        with:
          name: Playwright API Tests           # Name of the check run which will be created
          path: results.xml    # Path to test results
          reporter: java-junit
          fail-on-error: true
      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: |
                results.xml
                playwright-report